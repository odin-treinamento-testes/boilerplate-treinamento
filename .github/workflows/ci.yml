# Roda a cada Pull Request e a cada push na main.
# Faz o mesmo que você roda na sua máquina antes de abrir o PR: python -m pytest
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Nenhum dado do cliente versionado
        run: |
          if git ls-files | grep -E '\.(csv|xlsx|parquet)$'; then
            echo "::error::Há arquivos de dados no repositório (listados acima). Remova-os do git."
            exit 1
          fi

      - name: Testes
        run: python -m pytest
